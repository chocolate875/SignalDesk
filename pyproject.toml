[project]
name = "signaldesk"
version = "0.1.0"
description = "Local-first technical signal monitoring with Codex analysis and QQ official notifications"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=14,<17",
  "pandas>=2.2,<3", "numpy>=2,<3", "ta==0.11.0", "httpx>=0.27,<1",
  "pydantic>=2.8,<3", "cryptography>=43", "exchange-calendars>=4.6,<5",
  "longport>=3,<5", "pillow>=10", "pystray>=0.19; sys_platform == 'win32'",
]

[project.scripts]
signaldesk = "signaldesk.desktop:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signaldesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
