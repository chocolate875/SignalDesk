name: SignalDesk CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: 提交规范
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 检查本地文件和技能目录历史
        shell: bash
        run: |
          ignored_files=$(git ls-files --cached --ignored --exclude-per-directory=.gitignore)
          if [[ -n "$ignored_files" ]]; then
            echo "有被 .gitignore 排除的文件已被跟踪，请在本地用 git ls-files -ci --exclude-per-directory=.gitignore 核查。"
            exit 1
          fi
          skill_commit=$(git rev-list --full-history -1 HEAD -- .agents/skills)
          if [[ -n "$skill_commit" ]]; then
            echo "提交历史包含本机技能目录 .agents/skills/，请从待合并的提交中移除。"
            exit 1
          fi
      - name: 检查 PR 来源
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$GITHUB_HEAD_REF" in
            codex|codex/*|agent|agent/*)
              echo "Agent 临时分支仅限本地，请将改动合入正式任务分支。"
              exit 1 ;;
          esac
          if [[ "$GITHUB_BASE_REF" == main ]]; then
            if [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]]; then
              case "$GITHUB_HEAD_REF" in develop|release/?*|hotfix/?*) exit 0 ;; esac
            fi
            echo "main 仅接受本仓库的 develop、release/* 或 hotfix/*；外部贡献请先提交到 develop。"
            exit 1
          fi
      - name: 校验 PR 标题与全部新增提交
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check_commits.py --title="$PR_TITLE"
          python3 scripts/check_commits.py --range "$BASE_SHA..$HEAD_SHA"
      - name: 校验长期分支新增提交
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=8cd4ba0d9713ddca9751d92729b7ef8174488e46
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          fi
          python3 scripts/check_commits.py --range "$BASE_SHA..$HEAD_SHA"
  project:
    name: 工程验证
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check signaldesk tests scripts/check_commits.py
      - name: 检查界面最小字号
        run: |
          uv run --frozen python -c "import pathlib,re; css=pathlib.Path('frontend/src/style.css').read_text(encoding='utf-8'); sizes=[float(x) for x in re.findall(r'font-size\s*:\s*([0-9.]+)px',css)]; print('最小字号', min(sizes)); assert min(sizes) >= 12"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run --frozen pytest -q
